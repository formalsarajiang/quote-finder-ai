<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Quote Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c14;
      --surface: #12121e;
      --ivory: #f0ead8;
      --muted: #7a7590;
      --gold: #c9a84c;
      --rose: #b87878;
      --sage: #6e9e7e;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ivory);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* Subtle star-field background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.15) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 15%, rgba(255,255,255,0.10) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.08) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.12) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 70%, rgba(255,255,255,0.07) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.09) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 90%, rgba(255,255,255,0.06) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 50%, rgba(255,255,255,0.08) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 3rem 2rem;
    }

    /* ── Header ── */
    header {
      text-align: center;
    }

    .eyebrow {
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 400;
      color: var(--ivory);
      line-height: 1.15;
    }

    h1 em {
      font-style: italic;
      color: var(--gold);
    }

    /* ── Quote stage ── */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 740px;
      text-align: center;
      padding: 2rem 0;
    }

    .prompt-text {
      font-size: 0.85rem;
      color: var(--muted);
      font-style: italic;
      letter-spacing: 0.04em;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .prompt-text.hidden { opacity: 0; pointer-events: none; }

    .quote-display {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.7s ease, transform 0.7s ease;
      pointer-events: none;
      position: absolute;
      width: 100%;
      max-width: 680px;
      padding: 0 1rem;
    }

    .quote-display.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      position: relative;
    }

    .accent-line {
      width: 2px;
      height: 0;
      margin: 0 auto 1.8rem;
      transition: height 0.5s ease 0.2s, background 0.3s ease;
    }

    .quote-display.visible .accent-line {
      height: 3rem;
    }

    .quote-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.15rem, 3vw, 1.65rem);
      font-weight: 400;
      line-height: 1.65;
      color: var(--ivory);
      font-style: italic;
      max-width: 60ch;
      margin: 0 auto 1.6rem;
    }

    .quote-text::before { content: '\201C'; }
    .quote-text::after  { content: '\201D'; }

    .attribution {
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--muted);
      line-height: 1.6;
    }

    .attribution .name {
      font-weight: 500;
      font-size: 0.82rem;
      color: var(--ivory);
      opacity: 0.85;
    }

    /* ── Buttons ── */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      width: 100%;
    }

    .controls-label {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .buttons {
      display: flex;
      gap: 0.9rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      position: relative;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--ivory);
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.75rem 2rem;
      cursor: pointer;
      transition: border-color 0.25s, color 0.25s, background 0.25s;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn:hover { background: rgba(255,255,255,0.04); }

    .btn.intelligence { --accent: var(--gold); }
    .btn.resilience   { --accent: var(--sage); }
    .btn.compassion   { --accent: var(--rose); }

    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.active { border-color: var(--accent); color: var(--accent); background: rgba(255,255,255,0.03); }

    .btn .dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 0.55rem;
      vertical-align: middle;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn.active .dot, .btn:hover .dot { opacity: 1; }

    /* ── Loading shimmer ── */
    @keyframes shimmer {
      0%   { opacity: 0.3; }
      50%  { opacity: 0.7; }
      100% { opacity: 0.3; }
    }

    .btn[style*="opacity"] .dot {
      animation: shimmer 1s ease-in-out infinite;
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .quote-display, .accent-line, .prompt-text { transition: none; }
    }

    @media (max-width: 480px) {
      .wrapper { padding: 2rem 1.2rem; }
      .buttons { flex-direction: column; align-items: stretch; }
      .btn { text-align: center; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <p class="eyebrow">A curated collection</p>
    <h1>Words worth<br><em>carrying with you</em></h1>
  </header>

  <div class="stage">
    <p class="prompt-text" id="promptText">Choose a virtue below to receive its wisdom.</p>
    <div class="quote-display" id="quoteDisplay">
      <div class="accent-line" id="accentLine"></div>
      <p class="quote-text" id="quoteText"></p>
      <div class="attribution">
        <span class="name" id="quotePerson"></span><br>
        <span id="quoteWork"></span>
      </div>
    </div>
  </div>

  <div class="controls">
    <p class="controls-label">Explore a virtue</p>
    <div class="buttons">
      <button class="btn intelligence" onclick="showQuote('intelligence')">
        <span class="dot"></span>Intelligence
      </button>
      <button class="btn resilience" onclick="showQuote('resilience')">
        <span class="dot"></span>Resilience
      </button>
      <button class="btn compassion" onclick="showQuote('compassion')">
        <span class="dot"></span>Compassion
      </button>
    </div>
  </div>

</div>

<script>
  const colors = {
    intelligence: '#c9a84c',
    resilience:   '#6e9e7e',
    compassion:   '#b87878',
  };

  // Track shown quotes per category to avoid repeats
  const shown = { intelligence: [], resilience: [], compassion: [] };
  let isLoading = false;

  const ALIASES = {
    'tenzin gyatso': 'Dalai Lama',
    'dalai lama xiv': 'Dalai Lama',
    'his holiness the dalai lama': 'Dalai Lama',
    'samuel clemens': 'Mark Twain',
    'françois-marie arouet': 'Voltaire',
    'mary ann evans': 'George Eliot',
  };

  function normalizeName(name) {
    return ALIASES[(name || '').toLowerCase()] || name;
  }

  async function fetchQuote(category) {

    const usedAuthors = [...new Set(shown[category].map(e => normalizeName(e.person)))].filter(Boolean);
    const recentSnippets = shown[category].slice(-6).map(e => `"${e.text.slice(0, 60)}..."`).join(', ');

    const avoidAuthors = usedAuthors.length ? `Do not use these authors: ${usedAuthors.join(', ')}.` : '';
    const avoidSnippets = recentSnippets ? `Do not return quotes beginning with: ${recentSnippets}.` : '';

    const systemPrompt = `You are a quote database. When asked for a quote, respond with exactly this format and nothing else:
STARTJSON
{"text": "the full quote text", "person": "author full name", "work": "title of source work, or null if none"}
ENDJSON
No other text, no markdown, no explanation.`;

    const userPrompt = `Give me one genuine, well-known quote about ${category} by a real person. Do not invent or paraphrase. Draw from literature, philosophy, science, poetry, religion, or politics. ${avoidAuthors} ${avoidSnippets}`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: "user", content: userPrompt }]
      })
    });

    const data = await response.json();

    // Surface any API-level errors clearly
    if (!response.ok || data.type === "error") {
      throw new Error(`API error: ${JSON.stringify(data.error || data)}`);
    }

    const textBlock = Array.isArray(data.content)
      ? data.content.find(b => b.type === "text")
      : null;

    if (!textBlock?.text) {
      throw new Error(`Unexpected response shape: ${JSON.stringify(data)}`);
    }

    const raw = textBlock.text;
    console.log("Raw API response:", raw);

    const start = raw.indexOf('STARTJSON');
    const end   = raw.indexOf('ENDJSON');
    if (start === -1 || end === -1) throw new Error(`Delimiters not found in: ${raw}`);

    const jsonStr = raw.slice(start + 9, end).trim();
    console.log("Extracted JSON:", jsonStr);
    return JSON.parse(jsonStr);
  }

  async function showQuote(category) {
    if (isLoading) return;
    isLoading = true;

    const display    = document.getElementById('quoteDisplay');
    const promptText = document.getElementById('promptText');
    const btn        = document.querySelector(`.btn.${category}`);

    // Button loading state
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    btn.style.opacity = '0.6';
    btn.style.pointerEvents = 'none';

    // Fade out first, then fetch — so new content never appears during a fade
    const wasVisible = display.classList.contains('visible');
    display.classList.remove('visible');

    // Always wait for the CSS transition to fully finish before doing anything else
    const FADE_MS = wasVisible ? 750 : 0;

    const [q] = await Promise.all([
      fetchQuote(category),
      new Promise(res => setTimeout(res, FADE_MS))
    ]);

    try {
      if (!q.text) throw new Error("Empty quote");

      // Track to avoid repeats (normalize aliases)
      shown[category].push({ text: q.text, person: normalizeName(q.person || '') });

      document.getElementById('quoteText').textContent = q.text;
      document.getElementById('quotePerson').textContent = q.person || '';
      document.getElementById('quoteWork').textContent = q.work || '';
      document.getElementById('accentLine').style.background = colors[category];
      display.classList.add('visible');
      promptText.classList.add('hidden');

    } catch (err) {
      console.error("Quote fetch failed:", err);
      document.getElementById('quoteText').textContent = "The muse is momentarily silent. Try again.";
      document.getElementById('quotePerson').textContent = '';
      document.getElementById('quoteWork').textContent = '';
      document.getElementById('accentLine').style.background = colors[category];
      display.classList.add('visible');
      promptText.classList.add('hidden');
    } finally {
      btn.style.opacity = '';
      btn.style.pointerEvents = '';
      isLoading = false;
    }
  }
</script>
</body>
</html>
