<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Quote Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c14;
      --surface: #12121e;
      --ivory: #f0ead8;
      --muted: #7a7590;
      --gold: #c9a84c;
      --rose: #b87878;
      --sage: #6e9e7e;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ivory);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* Subtle star-field background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.15) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 15%, rgba(255,255,255,0.10) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.08) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.12) 0%, transparent 100%),
        radial-gradient(1px 1px at 10% 70%, rgba(255,255,255,0.07) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.09) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 90%, rgba(255,255,255,0.06) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 50%, rgba(255,255,255,0.08) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 3rem 2rem;
    }

    /* ── Header ── */
    header {
      text-align: center;
    }

    .eyebrow {
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 400;
      color: var(--ivory);
      line-height: 1.15;
    }

    h1 em {
      font-style: italic;
      color: var(--gold);
    }

    /* ── Quote stage ── */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 740px;
      text-align: center;
      padding: 2rem 0;
    }

    .prompt-text {
      font-size: 0.85rem;
      color: var(--muted);
      font-style: italic;
      letter-spacing: 0.04em;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .prompt-text.hidden { opacity: 0; pointer-events: none; }

    .quote-display {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.7s ease, transform 0.7s ease;
      pointer-events: none;
      position: absolute;
      width: 100%;
      max-width: 680px;
      padding: 0 1rem;
    }

    .quote-display.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      position: relative;
    }

    .accent-line {
      width: 2px;
      height: 0;
      margin: 0 auto 1.8rem;
      transition: height 0.5s ease 0.2s, background 0.3s ease;
    }

    .quote-display.visible .accent-line {
      height: 3rem;
    }

    .quote-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.15rem, 3vw, 1.65rem);
      font-weight: 400;
      line-height: 1.65;
      color: var(--ivory);
      font-style: italic;
      max-width: 60ch;
      margin: 0 auto 1.6rem;
    }

    .quote-text::before { content: '\201C'; }
    .quote-text::after  { content: '\201D'; }

    .attribution {
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--muted);
      line-height: 1.6;
    }

    .attribution .name {
      font-weight: 500;
      font-size: 0.82rem;
      color: var(--ivory);
      opacity: 0.85;
    }

    /* ── Buttons ── */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      width: 100%;
    }

    .controls-label {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .buttons {
      display: flex;
      gap: 0.9rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      position: relative;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--ivory);
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.75rem 2rem;
      cursor: pointer;
      transition: border-color 0.25s, color 0.25s, background 0.25s;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn:hover { background: rgba(255,255,255,0.04); }

    .btn.intelligence { --accent: var(--gold); }
    .btn.resilience   { --accent: var(--sage); }
    .btn.compassion   { --accent: var(--rose); }

    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.active { border-color: var(--accent); color: var(--accent); background: rgba(255,255,255,0.03); }

    .btn .dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 0.55rem;
      vertical-align: middle;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .btn.active .dot, .btn:hover .dot { opacity: 1; }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .quote-display, .accent-line, .prompt-text { transition: none; }
    }

    @media (max-width: 480px) {
      .wrapper { padding: 2rem 1.2rem; }
      .buttons { flex-direction: column; align-items: stretch; }
      .btn { text-align: center; }
    }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <p class="eyebrow">A curated collection</p>
    <h1>Words worth<br><em>carrying with you</em></h1>
  </header>

  <div class="stage">
    <p class="prompt-text" id="promptText">Choose a virtue below to receive its wisdom.</p>
    <div class="quote-display" id="quoteDisplay">
      <div class="accent-line" id="accentLine"></div>
      <p class="quote-text" id="quoteText"></p>
      <div class="attribution">
        <span class="name" id="quotePerson"></span><br>
        <span id="quoteWork"></span>
      </div>
    </div>
  </div>

  <div class="controls">
    <p class="controls-label">Explore a virtue</p>
    <div class="buttons">
      <button class="btn intelligence" onclick="showQuote('intelligence')">
        <span class="dot"></span>Intelligence
      </button>
      <button class="btn resilience" onclick="showQuote('resilience')">
        <span class="dot"></span>Resilience
      </button>
      <button class="btn compassion" onclick="showQuote('compassion')">
        <span class="dot"></span>Compassion
      </button>
    </div>
  </div>

</div>

<script>
  const quotes = {
    intelligence: [
      { text: "The true sign of intelligence is not knowledge but imagination.", person: "Albert Einstein", work: null },
      { text: "It takes something more than intelligence to act intelligently.", person: "Fyodor Dostoyevsky", work: "Crime and Punishment" },
      { text: "The test of a first-rate intelligence is the ability to hold two opposed ideas in the mind at the same time, and still retain the ability to function.", person: "F. Scott Fitzgerald", work: "The Crack-Up" },
      { text: "Talent hits a target no one else can hit; genius hits a target no one else can see.", person: "Arthur Schopenhauer", work: null },
      { text: "A good head and good heart are always a formidable combination. But when you add to that a literate tongue or pen, then you have something very special.", person: "Nelson Mandela", work: null },
      { text: "I know that I am intelligent, because I know that I know nothing.", person: "Socrates", work: null },
      { text: "Intelligence plus character — that is the goal of true education.", person: "Martin Luther King Jr.", work: null },
      { text: "The measure of intelligence is the ability to change.", person: "Albert Einstein", work: null },
      { text: "I'm a pessimist because of intelligence, but an optimist because of will.", person: "Antonio Gramsci", work: "Prison Letters" },
      { text: "Man becomes man only by the intelligence, but he is man only by the heart.", person: "Henri Frédéric Amiel", work: "Journal Intime" },
      { text: "Anyone who conducts an argument by appealing to authority is not using his intelligence — he is just using his memory.", person: "Leonardo da Vinci", work: null },
      { text: "Your assumptions are your windows on the world. Scrub them off every once in a while, or the light won't come in.", person: "Alan Alda", work: null },
      { text: "It is the mark of an educated mind to be able to entertain a thought without accepting it.", person: "Aristotle", work: null },
      { text: "Nothing whets the intelligence more than a passionate suspicion.", person: "Stefan Zweig", work: "The Burning Secret" },
      { text: "Knowing others is intelligence; knowing yourself is true wisdom. Mastering others is strength; mastering yourself is true power.", person: "Lao Tzu", work: "Tao Te Ching" },
    ],
    resilience: [
      { text: "I can be changed by what happens to me. But I refuse to be reduced by it.", person: "Maya Angelou", work: null },
      { text: "The best way out is always through.", person: "Robert Frost", work: "A Servant to Servants" },
      { text: "It is really wonderful how much resilience there is in human nature. Let any obstructing cause, no matter what, be removed in any way, even by death, and we fly back to first principles of hope and enjoyment.", person: "Bram Stoker", work: "Dracula" },
      { text: "My barn having burned down, I can now see the moon.", person: "Mizuta Masahide", work: "Barn's Burnt Down" },
      { text: "Hardships often prepare ordinary people for an extraordinary destiny.", person: "C.S. Lewis", work: null },
      { text: "The world breaks everyone, and afterward, some are strong at the broken places.", person: "Ernest Hemingway", work: "A Farewell to Arms" },
      { text: "In the depth of winter, I finally learned that within me there lay an invincible summer.", person: "Albert Camus", work: null },
      { text: "Out of suffering have emerged the strongest souls; the most massive characters are seared with scars.", person: "Kahlil Gibran", work: null },
      { text: "The impediment to action advances action. What stands in the way becomes the way.", person: "Marcus Aurelius", work: "Meditations" },
      { text: "Difficulties strengthen the mind, as labor does the body.", person: "Seneca", work: null },
      { text: "When we are no longer able to change a situation, we are challenged to change ourselves.", person: "Viktor Frankl", work: "Man's Search for Meaning" },
      { text: "Rock bottom became the solid foundation on which I rebuilt my life.", person: "J.K. Rowling", work: null },
      { text: "Do not judge me by my successes. Judge me by how many times I fell down and got back up again.", person: "Nelson Mandela", work: null },
      { text: "You have power over your mind, not outside events. Realize this, and you will find strength.", person: "Marcus Aurelius", work: "Meditations" },
      { text: "Grief can be the garden of compassion. If you keep your heart open through everything, your pain can become your greatest ally in your life's search for love and wisdom.", person: "Rumi", work: null },
    ],
    compassion: [
      { text: "Love and compassion are necessities, not luxuries. Without them, humanity cannot survive.", person: "Dalai Lama", work: "The Art of Happiness" },
      { text: "If we have no peace, it is because we have forgotten that we belong to each other.", person: "Mother Teresa", work: null },
      { text: "For there is nothing heavier than compassion. Not even one's own pain weighs so heavy as the pain one feels with someone, for someone.", person: "Milan Kundera", work: "The Unbearable Lightness of Being" },
      { text: "Our human compassion binds us the one to the other — not in pity or patronizingly, but as human beings who have learnt how to turn our common suffering into hope for the future.", person: "Nelson Mandela", work: null },
      { text: "The whole idea of compassion is based on a keen awareness of the interdependence of all these living beings, which are all part of one another, and all involved in one another.", person: "Thomas Merton", work: "Choosing to Love the World: On Contemplation" },
      { text: "Compassion is not a relationship between the healer and the wounded. It's a relationship between equals. Only when we know our own darkness well can we be present with the darkness of others.", person: "Pema Chödrön", work: "Comfortable with Uncertainty" },
      { text: "The purpose of human life is to serve, and to show compassion and the will to help others.", person: "Albert Schweitzer", work: null },
      { text: "Our task must be to free ourselves by widening our circle of compassion to embrace all living creatures and the whole of nature in its beauty.", person: "Albert Einstein", work: null },
      { text: "Wisdom, compassion, and courage are the three universally recognized moral qualities of men.", person: "Confucius", work: "The Analects" },
      { text: "If once we admit, be it for a single hour or in a single instance, that there can be anything more important than compassion for a fellow human being, then there is no crime against man that we cannot commit with an easy conscience.", person: "Leo Tolstoy", work: null },
      { text: "Compassion is the chief law of human existence.", person: "Fyodor Dostoyevsky", work: null },
      { text: "We must learn to regard people less in the light of what they do or omit to do, and more in the light of what they suffer.", person: "Dietrich Bonhoeffer", work: null },
      { text: "If you want others to be happy, practice compassion. If you want to be happy, practice compassion.", person: "Dalai Lama", work: null },
      { text: "Until he extends the circle of his compassion to all living things, man will not himself find peace.", person: "Albert Schweitzer", work: null },
      { text: "Compassion is a verb.", person: "Thich Nhat Hanh", work: null },
    ],
  };

  const colors = {
    intelligence: '#c9a84c',
    resilience:   '#6e9e7e',
    compassion:   '#b87878',
  };

  // Per-category shuffled queues — ensures no repeat until pool is exhausted
  const queues = { intelligence: [], resilience: [], compassion: [] };

  function shuffle(arr) {
    const a = [...arr.keys()];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function nextIndex(category) {
    if (queues[category].length === 0) {
      queues[category] = shuffle(quotes[category]);
      // If only one quote, nothing to avoid; otherwise prevent same last as new first
    }
    return queues[category].shift();
  }

  function showQuote(category) {
    const pool = quotes[category];
    const idx = nextIndex(category);
    const q = pool[idx];
    const display  = document.getElementById('quoteDisplay');
    const promptText = document.getElementById('promptText');

    // Reset animation
    display.classList.remove('visible');

    setTimeout(() => {
      document.getElementById('quoteText').textContent = q.text;
      document.getElementById('quotePerson').textContent = q.person;
      const workEl = document.getElementById('quoteWork');
      workEl.textContent = q.work ? q.work : '';
      document.getElementById('accentLine').style.background = colors[category];

      display.classList.add('visible');
      promptText.classList.add('hidden');
    }, display.classList.contains('visible') ? 350 : 50);

    // Update active button state
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.btn.${category}`).classList.add('active');
  }
</script>
</body>
</html>
